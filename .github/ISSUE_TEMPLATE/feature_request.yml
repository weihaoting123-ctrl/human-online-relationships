name: 功能建议
description: 提出有边界、可用合成数据验收的改进建议。
title: "[Feature]: "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [路线图](https://github.com/weihaoting123-ctrl/human-online-relationships/blob/main/ROADMAP.md)。建议不等于实施或发布日期承诺。
        不要用真实聊天、联系人、账号、音频、日志、截图或密钥说明需求；仅用完全虚构的场景。安全漏洞请私下报告。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我的正文与附件只含完全合成的场景，不含真实个人资料、凭据或真实日志/截图。
          required: true
  - type: dropdown
    id: module_area
    attributes:
      label: 主要模块
      options:
        - dashboard（页面/主题/无障碍）
        - timeline（时间统计/节点/关联）
        - ai（授权/分析/分段缓存）
        - library（管理库/标签/回收站）
        - import-sync（导入/只读同步）
        - media-voice（媒体/语音）
        - backup（备份/恢复）
        - privacy-security（隐私增强；不是漏洞披露）
        - docs（文档）
        - ci（测试/发布）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述虚构场景中的操作障碍，不评价或诊断真实人物。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与非目标
      description: 说明期望改变什么、明确不改变什么，以及考虑过的替代方案。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验收条件
      description: 列出可用合成数据验证的结果，包含失败、空数据、部分完成等相关边界。
      placeholder: |
        - [ ] 在合成场景下……
        - [ ] 失败时……
        - [ ] 不会……
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 数据、联网、费用与兼容性影响
      description: 是否增加存储、上传、授权、模型调用、删除或迁移？不确定可直接说明；新增权限不能默认为已获授权。
    validations:
      required: true
