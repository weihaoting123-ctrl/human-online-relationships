name: Synthetic tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fork pull requests receive no write token, environment, or user credentials.
permissions:
  contents: read

concurrency:
  group: synthetic-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_ONLY_BINARY: ':all:'

jobs:
  tests:
    name: Python 3.12 / Node 22 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      SHE_LOVE_ME_UI_TESTS: '1'
      SHE_LOVE_ME_UI_SCREENSHOTS: '0'
    steps:
      - name: Check out public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Check the Git publication boundary
        run: python scripts/check_public_release.py --root .

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install public Python dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Install Chinese glyph coverage on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk

      - name: Run every synthetic Python test, including the browser UI
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the standalone catalog tests
        run: node --test tests/test_catalog.cjs

      # Browser fixtures may create temporary synthetic files. Never upload them,
      # screenshots, traces, logs, data/, reports/, backups/, or a virtualenv.
      # setup-python caches only public pip downloads, not workspace contents.

  dependency-audit:
    name: Public dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both marker environments are audited, including Windows-only packages.
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out public dependency declarations
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install the pinned public audit tool
        run: >-
          python -m pip install --only-binary=:all: pip-audit==2.10.1

      - name: Audit declared packages, not repository source or user data
        # PyPI receives public package names/versions only. No --fix, source
        # upload, API key, external scanner action, or artifact publishing.
        run: python -m pip_audit --requirement requirements-dev.txt --progress-spinner off
